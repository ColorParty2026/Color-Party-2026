<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Party 2026 — Spin Wheel</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#101025}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#393075,#101025 70%)}main{max-width:600px;margin:auto;padding:25px 18px 50px;text-align:center}h1{font-size:clamp(28px,7vw,43px);margin:8px 0}p{color:#d4d0ed}.panel{background:#ffffff12;border:1px solid #ffffff30;border-radius:22px;padding:18px;margin:18px 0}select,input,button{font:inherit;border-radius:12px;padding:12px;border:0}select,input{width:100%;background:#fff;color:#24223b;margin:8px 0}button{background:#ffcd5b;color:#211c36;font-weight:800;cursor:pointer;margin:8px}button:disabled{opacity:.5;cursor:not-allowed}.wheel-wrap{width:min(85vw,360px);height:min(85vw,360px);position:relative;margin:25px auto}.pointer{position:absolute;z-index:3;top:-14px;left:calc(50% - 16px);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid #ffdb65;filter:drop-shadow(0 3px 2px #0007)}#wheel{width:100%;height:100%;border-radius:50%;border:9px solid #fff;box-shadow:0 0 0 5px #ffd76a,0 15px 35px #0008;transition:transform 4.2s cubic-bezier(.12,.8,.12,1);position:relative;overflow:hidden;background:conic-gradient(#ff6699 0 120deg,#54c8e8 120deg 240deg,#a78bfa 240deg 360deg)}.name{position:absolute;top:50%;left:50%;font-size:clamp(16px,5vw,24px);font-weight:900;text-shadow:0 2px 5px #0008;transform-origin:0 0}.n1{transform:rotate(60deg) translateY(-110px) rotate(-60deg)}.n2{transform:rotate(180deg) translateY(-110px) rotate(-180deg)}.n3{transform:rotate(300deg) translateY(-110px) rotate(-300deg)}#result{font-size:25px;font-weight:900;min-height:35px;color:#ffdb65}small{color:#bcb6d8}ol{text-align:left;line-height:1.9}#status{font-size:13px;line-height:1.5}.pill{display:inline-block;background:#ffffff20;padding:6px 12px;border-radius:20px}
</style></head><body><main><div class="pill">🎉 LEADER 2026 🎉</div><h1>COLOR PARTY 2026</h1><p>Spin Party Wheel 🎡</p><section class="panel"><label for="person">Siapa yang putar?</label><select id="person"><option>Sonia</option><option>Fifah</option><option>Dyg</option><option>Yun</option></select><div id="remaining"></div><div class="wheel-wrap"><div class="pointer"></div><div id="wheel"><span class="name n1">Fifah</span><span class="name n2">Dyg</span><span class="name n3">Yun</span></div></div><button id="spin">🎡 SPIN!</button><div id="result" aria-live="polite"></div></section><section class="panel"><h2>Keputusan</h2><ol id="history"></ol><button id="reload" type="button">↻ Muat semula rekod</button></section><section class="panel"><h2>Sambung Supabase</h2><p>Masukkan Project URL dan publishable/anon key. Maklumat ini disimpan pada pelayar peranti ini sahaja.</p><input id="url" placeholder="https://PROJECT.supabase.co" autocomplete="off"><input id="key" placeholder="Supabase publishable / anon key" autocomplete="off"><button id="connect">Simpan sambungan</button><div id="status"></div></section><small>Setiap peserta: 2 putaran • Nama boleh berulang</small></main><script>
const $=id=>document.getElementById(id), people=['Sonia','Fifah','Dyg','Yun'];let settings=JSON.parse(localStorage.getItem('colorPartySupabase')||'{}'),records=[],busy=false,rotation=0;
$('url').value=settings.url||'';$('key').value=settings.key||'';
function setStatus(msg){$('status').textContent=msg}function apiUrl(path){return settings.url.replace(/\/$/,'')+'/rest/v1/'+path}async function request(path,opts={}){if(!settings.url||!settings.key)throw Error('Sambungkan Supabase dahulu.');let r=await fetch(apiUrl(path),{...opts,headers:{apikey:settings.key,Authorization:'Bearer '+settings.key,...opts.headers}});if(!r.ok)throw Error('Supabase: '+r.status+' '+(await r.text()).slice(0,180));return r.status===204?null:r.json()}
function show(){let p=$('person').value,count=records.filter(x=>x.participant_name===p).length;$('remaining').textContent=`${p}: ${Math.max(0,2-count)} daripada 2 putaran tinggal`;$('spin').disabled=busy||count>=2||!settings.url||!settings.key;$('history').innerHTML='';for(let p of people){let rows=records.filter(x=>x.participant_name===p).sort((a,b)=>a.spin_number-b.spin_number);for(let r of rows){let li=document.createElement('li');li.textContent=`${p} — Putaran ${r.spin_number}: ${r.selected_name}`;$('history').append(li)}}}
async function load(){try{let participants=await request('party_participants?select=id,name'),draws=await request('party_draws?select=participant_id,spin_number,selected_name&order=created_at.asc');records=draws.map(d=>({...d,participant_name:participants.find(p=>p.id===d.participant_id)?.name||'?'}));setStatus('✅ Bersambung. Rekod dikemas kini.');show()}catch(e){setStatus('⚠️ '+e.message);show()}}
$('person').onchange=()=>{$('result').textContent='';show()};$('reload').onclick=load;$('connect').onclick=()=>{let url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)||!key){setStatus('Sila isi URL Supabase dan key yang betul.');return}settings={url,key};localStorage.setItem('colorPartySupabase',JSON.stringify(settings));load()};
$('spin').onclick=async()=>{if(busy)return;busy=true;show();$('result').textContent='Sedang berputar...';let p=$('person').value;try{let participants=await request('party_participants?select=id,name&name=eq.'+encodeURIComponent(p));if(participants.length!==1)throw Error('Peserta tidak ditemui.');let tokens=await request('party_tokens?select=token&participant_id=eq.'+participants[0].id);if(tokens.length!==1)throw Error('Token peserta tiada atau berganda.');let response=await fetch(settings.url.replace(/\/$/,'')+'/rest/v1/rpc/spin_party_wheel',{method:'POST',headers:{apikey:settings.key,Authorization:'Bearer '+settings.key,'Content-Type':'application/json'},body:JSON.stringify({p_token:tokens[0].token})});if(!response.ok)throw Error((await response.text()).slice(0,200));let result=await response.json(),name=result.selected_name;let idx=['Fifah','Dyg','Yun'].indexOf(name);if(idx<0)throw Error('Keputusan tidak dikenali.');let target=[60,180,300][idx];let current=((rotation%360)+360)%360;let delta=(360-target-current+360)%360;rotation+=360*6+delta;$('wheel').style.transform=`rotate(${rotation}deg)`;setTimeout(async()=>{$('result').textContent='🎉 '+name+' 🎉';busy=false;await load();$('result').textContent='🎉 '+name+' 🎉'},4300)}catch(e){busy=false;$('result').textContent='⚠️ '+e.message;await load()}};
show();if(settings.url&&settings.key)load();else setStatus('Belum disambungkan ke Supabase.');
</script></body></html>
